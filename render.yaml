services:
  - type: web
    name: gyro-store
    runtime: node
    plan: starter
    region: oregon
    buildCommand: |
      npm install
      cd frontend && npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        sync: false
      # Firebase Admin (pegar el JSON del service account)
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Firebase Web Config (config pública del cliente)
      - key: FIREBASE_WEB_CONFIG
        sync: false
      # Email SMTP
      - key: EMAIL_CONFIG
        sync: false
      # Roles de arranque
      - key: ADMIN_EMAILS
        sync: false
      - key: SELLER_EMAILS
        sync: false
      - key: PROTECTED_ADMIN_EMAIL
        sync: false
      # CORS
      - key: CORS_ORIGIN
        sync: false
